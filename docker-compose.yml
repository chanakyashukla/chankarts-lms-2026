version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: chankarts
      POSTGRES_PASSWORD: chankarts_dev
      POSTGRES_DB: chankarts_academy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
