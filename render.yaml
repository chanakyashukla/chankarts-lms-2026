# Render Blueprint — ChankArts LMS (single FREE web service)
#
# Architecture: one Free Python web service runs the existing FastAPI app,
# which ALSO serves the existing frontend/ files under /academy/ (same
# origin as /api/v1). No Render-managed database is provisioned: the
# application uses the existing Neon PostgreSQL (pooled endpoint).
#
# Required (enter after the Blueprint is created — set sync: false values):
#   DATABASE_URL             Neon POOLED connection:
#                            postgresql+asyncpg://USER:PASSWORD@HOST-pooler.REGION.aws.neon.tech/DB?ssl=require
#   MIGRATIONS_DATABASE_URL  (optional) Neon DIRECT/non-pooler connection:
#                            same URL without "-pooler", ?ssl=require
#   SEED_ADMIN_EMAIL / SEED_ADMIN_USERNAME / SEED_ADMIN_PASSWORD
#                            initial administrator (created once at first boot)
# SECRET_KEY is generated by Render and stored as a secret.
#
# Notes:
# - Uploads (assignments/study material) use container-local storage and are
#   NOT persistent across redeploys. Configure R2 later for durable uploads;
#   no fake R2 credentials are used.
# - Razorpay stays disabled (RAZORPAY_MODE=disabled) until real keys exist.
services:
  - type: web
    name: chankarts-lms-2026
    runtime: python
    plan: free
    branch: cloudflare-containers-deploy   # deploy from this branch (not main)
    autoDeployTrigger: commit
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false            # Neon pooled: postgresql+asyncpg://…-pooler…/neondb?ssl=require
      - key: MIGRATIONS_DATABASE_URL
        sync: false            # optional Neon direct endpoint for Alembic only
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_MODE
        value: "disabled"      # enable only with real keys
      - key: EMAIL_TEST_MODE
        value: "true"
      - key: WEB3FORMS_ACCESS_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: "chankarts.official@gmail.com"
      - key: FROM_NAME
        value: "ChankArts Music Academy"
      - key: FRONTEND_URL
        value: "https://chankarts.com"
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
